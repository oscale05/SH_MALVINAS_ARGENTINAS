<VirtualHost *:8080>
    ServerName hacienda.local
    DocumentRoot "/Users/slm/Proyectos/Comerciales/Sistema Hacienda/frontend/dist/frontend/browser"

    <Directory "/Users/slm/Proyectos/Comerciales/Sistema Hacienda/frontend/dist/frontend/browser">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8099/
    ProxyPassReverse /api/ http://127.0.0.1:8099/

    ErrorLog /tmp/hacienda-error.log
    CustomLog /tmp/hacienda-access.log combined
</VirtualHost>
