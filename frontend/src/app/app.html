<div class="app-shell">
  <header class="app-header">
    <span class="brand-text">Secretaría de Hacienda</span>
    <nav>
      <a routerLink="/"><ng-icon name="heroChartBar" /> Dashboard</a>
      @if (isLoggedIn) {
        <div class="user-menu">
          <button type="button" class="avatar-btn" (click)="toggleMenu()">
            <ng-icon [name]="username === 'administrador' ? 'heroShieldCheck' : 'heroUserCircle'" class="avatar-icon" />
            <span class="user-name">{{ username }}</span>
          </button>
          @if (menuOpen()) {
            <div class="dropdown">
              <button type="button" (click)="logout()">Cerrar sesión</button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login">Login</a>
      }
    </nav>
  </header>
  <main class="app-main">
    <router-outlet />
  </main>
</div>
