<VirtualHost *:80>
    ServerName hacienda.local
    DocumentRoot /var/www/hacienda/frontend/dist/frontend/browser

    <Directory /var/www/hacienda/frontend/dist/frontend/browser>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8099/
    ProxyPassReverse /api/ http://127.0.0.1:8099/

    ErrorLog ${APACHE_LOG_DIR}/hacienda-error.log
    CustomLog ${APACHE_LOG_DIR}/hacienda-access.log combined
</VirtualHost>
