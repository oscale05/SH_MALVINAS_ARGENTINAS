name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hacienda
          MYSQL_USER: hacienda
          MYSQL_PASSWORD: hacienda
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip
      - name: Create .env
        run: |
          printf 'APP_NAME=Hacienda\nAPP_ENV=testing\nAPP_PORT=8099\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=hacienda\nDB_USERNAME=hacienda\nDB_PASSWORD=hacienda\nJWT_SECRET=ci-test-secret\n' > backend/.env
      - name: Run migrations
        run: |
          mysql -h 127.0.0.1 -u hacienda -phacienda hacienda < backend/database/migrations/001_initial.sql
          OP_HASH=$(php -r "echo password_hash('operador123', PASSWORD_DEFAULT);")
          OB_HASH=$(php -r "echo password_hash('observador123', PASSWORD_DEFAULT);")
          mysql -h 127.0.0.1 -u hacienda -phacienda hacienda -e "INSERT INTO users (username,password_hash,role) VALUES ('operador','$OP_HASH','operador'), ('observador','$OB_HASH','observador');"
      - run: cd backend && find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: cd backend && php tests/test_xlsx_parser.php
      - run: cd backend && php tests/test_auth.php
      - name: Integration tests
        run: |
          cd backend
          php -S 127.0.0.1:8099 -t public >/tmp/server.log 2>&1 &
          sleep 2
          php tests/test_health.php
          php tests/test_summary.php
          php tests/test_completo.php
          php tests/test_all_endpoints.php
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm install --legacy-peer-deps
      - run: cd frontend && npm run build
      - run: cd frontend && npm test
